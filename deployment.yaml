apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventure-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventure
  template:
    metadata:
      labels:
        app: eventure
    spec:
      containers:
        - name: eventure
          image: eventure-app:{{BUILD_NUMBER}}
          imagePullPolicy: Never
          ports:
            - containerPort: 5050
